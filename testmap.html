<!-- JavaScript -->
<script>
function toggleHeader() {
  const header = document.getElementById('header');
  const button = document.querySelector('.toggle-header-btn');
  
  header.classList.toggle('hidden');
  
  if (header.classList.contains('hidden')) {
    button.textContent = 'Показать шапку';
  } else {
    button.textContent = 'Скрыть шапку';
  }
}


document.addEventListener('DOMContentLoaded', () => {
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      toggleHeader();
    }
  });
});
function toggleHeader() {
  const header = document.querySelector('header');
  const btn = document.getElementById('toggleMenuBtn');
  
  header.classList.toggle('collapsed');
  
  if(header.classList.contains('collapsed')) {
    btn.innerHTML = '▼ Показать меню';
    btn.style.backgroundColor = '#e74c3c';
  } else {
    btn.innerHTML = '▲ Свернуть меню';
    btn.style.backgroundColor = '#4CAF50';
  }
  document.querySelector('header').ondblclick = toggleHeader;
}
